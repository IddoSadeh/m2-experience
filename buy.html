<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M.2 | Buy Now</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="buy-page">
    <header class="site-menu" aria-label="Primary">
      <div class="site-menu__status" aria-label="Local interface status">
        <span class="site-menu__dot" aria-hidden="true"></span>
        <span id="locale-time">IL_17:05:48</span>
      </div>

      <div class="site-menu__actions">
        <nav class="site-menu__nav" aria-label="Site">
          <span class="site-menu__label-preview" aria-hidden="true">MENU</span>
          <a href="index.html">Home</a>
          <a href="m2.html">M2</a>
          <a href="m2os.html">M2_os</a>
          <a href="company.html">Company</a>
          <a href="buy.html">Cart</a>
        </nav>
        <button class="site-menu__icon" type="button" aria-label="Open menu">
          <span class="site-menu__mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </header>

    <main>
      <section class="buy-section" aria-labelledby="buy-title">
        <div class="buy-section__product" aria-hidden="true">
          <img src="assets/360/webp/footer-spin-001.webp" alt="" data-product-spin />
        </div>

        <aside class="order-card" aria-label="Order M.2 sensor">
          <div class="order-card__top">
            <div class="order-card__summary">
              <div>
                <h1 id="buy-title">M.2 Sensor</h1>
                <p>Sensing For Continuous Wear</p>
              </div>
              <div class="order-card__quantity" aria-label="Quantity">
                <button type="button" aria-label="Decrease quantity" data-quantity-action="decrease">-</button>
                <span data-order-quantity>1</span>
                <button type="button" aria-label="Increase quantity" data-quantity-action="increase">+</button>
              </div>
            </div>

            <div class="order-card__config">
              <div>
                <p>Your Configuration</p>
                <strong><span data-selected-plan>M.2 Standard</span> / <span data-selected-color>CLEAR&nbsp; #D9DDDE</span></strong>
              </div>
              <button class="order-card__config-toggle" type="button" aria-label="Edit configuration" aria-controls="order-config-options" aria-expanded="false">
                <span class="order-card__chevron" aria-hidden="true"></span>
              </button>
            </div>

            <div class="order-card__options" id="order-config-options" aria-hidden="true" inert>
              <fieldset class="order-card__plans">
                <legend>Choose Plan</legend>
                <div class="order-card__plan-grid">
                  <button type="button" data-order-plan="M.2 Standard" aria-pressed="true">
                    <span>M.2 Standard</span>
                    <small>15 Activation Credits<br />Per Mo.</small>
                    <b>$19/Mo.</b>
                  </button>
                  <button type="button" data-order-plan="M.2 Extra" aria-pressed="false">
                    <span>M.2 Extra</span>
                    <small>30 Activation Credits Per Mo.</small>
                    <b>$39/Mo.</b>
                  </button>
                </div>
              </fieldset>

              <fieldset class="order-card__colors">
                <legend>Pick Up A Color</legend>
                <div class="order-card__color-grid">
                  <button type="button" data-order-color="Rose #E2CBC4" aria-pressed="false"><i class="order-swatch order-swatch--rose" aria-hidden="true"></i>#E2CBC4</button>
                  <button type="button" data-order-color="Black #070707" aria-pressed="false"><i class="order-swatch order-swatch--black" aria-hidden="true"></i>#070707</button>
                  <button type="button" data-order-color="CLEAR #D9DDDE" aria-pressed="true"><i class="order-swatch order-swatch--clear" aria-hidden="true"></i>#FRC-01</button>
                  <button type="button" data-order-color="#PTRN-TORT" aria-pressed="false"><i class="order-swatch order-swatch--tort" aria-hidden="true"></i>#PTRN-TORT</button>
                  <button type="button" data-order-color="#IPTRN-DOT" aria-pressed="false"><i class="order-swatch order-swatch--dot" aria-hidden="true"></i>#IPTRN-DOT</button>
                </div>
              </fieldset>
            </div>
          </div>

          <div class="order-card__bottom">
            <p>Free shipping and returns</p>
            <button class="order-card__buy" type="button">Buy</button>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
