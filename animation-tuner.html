<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>m.2 ASCII Animation Tuner</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Tune the m.2 ASCII-to-image animation timing." />
    <link rel="stylesheet" href="styles.css" />
    <script src="animation-tuner.js" defer></script>
  </head>
  <body class="animation-tuner-page">
    <main class="animation-tuner">
      <section class="animation-tuner__preview" aria-label="Animation preview">
        <div class="animation-tuner__preview-bar">
          <span>Animation preview</span>
          <span id="animation-status" aria-live="polite">Ready</span>
        </div>

        <figure id="animation-stage" class="animation-tuner__stage">
          <img id="animation-ascii" src="assets/home-process-detection-ascii-figma.svg" alt="" aria-hidden="true" />
          <img id="animation-photo" src="assets/home-process-detection-color.png" alt="m.2 sensor worn behind an ear." />
        </figure>
      </section>

      <aside class="animation-tuner__controls" aria-label="Animation controls">
        <a class="animation-tuner__back" href="index.html">Back to site</a>
        <header>
          <p>m.2 tools</p>
          <h1>ASCII animation</h1>
        </header>

        <label class="animation-tuner__field">
          <span>Preview image</span>
          <select id="animation-scene">
            <option value="detection">Detection</option>
            <option value="encoding">Encoding</option>
            <option value="capture">Capture</option>
          </select>
        </label>

        <section class="animation-tuner__group" aria-labelledby="timing-title">
          <h2 id="timing-title">Timing</h2>

          <div class="animation-tuner__range" data-control="write">
            <div>
              <label for="write-duration">Character writing</label>
              <output for="write-duration">200 ms</output>
            </div>
            <input id="write-duration" type="range" min="100" max="3000" step="50" value="200" />
            <input id="write-duration-number" type="number" min="100" max="3000" step="50" value="200" aria-label="Character writing duration in milliseconds" />
          </div>

          <div class="animation-tuner__range" data-control="pause">
            <div>
              <label for="pause-duration">Pause after writing</label>
              <output for="pause-duration">120 ms</output>
            </div>
            <input id="pause-duration" type="range" min="0" max="1500" step="20" value="120" />
            <input id="pause-duration-number" type="number" min="0" max="1500" step="20" value="120" aria-label="Pause duration in milliseconds" />
          </div>

          <div class="animation-tuner__range" data-control="fade">
            <div>
              <label for="fade-duration">Image crossfade</label>
              <output for="fade-duration">1200 ms</output>
            </div>
            <input id="fade-duration" type="range" min="100" max="5000" step="50" value="1200" />
            <input id="fade-duration-number" type="number" min="100" max="5000" step="50" value="1200" aria-label="Image crossfade duration in milliseconds" />
          </div>
        </section>

        <div class="animation-tuner__summary">
          <span>Total duration</span>
          <strong id="animation-total">1.52 s</strong>
        </div>

        <label class="animation-tuner__toggle">
          <input id="animation-auto-replay" type="checkbox" checked />
          <span>Replay when adjusted</span>
        </label>

        <div class="animation-tuner__actions">
          <button id="animation-replay" type="button">Replay animation</button>
          <button id="animation-copy" type="button">Copy parameters</button>
          <button id="animation-reset" type="button">Reset values</button>
        </div>
      </aside>
    </main>
  </body>
</html>
